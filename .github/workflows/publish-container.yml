name: Publish container image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Only publish an image from a commit that builds cleanly, passes its tests and is in house style.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on master
        id: branch_check
        shell: bash
        run: |
          SHOULD_PUBLISH=true
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git fetch origin master --depth=1
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
              echo "Tag is not on master; image publish skipped."
              SHOULD_PUBLISH=false
            fi
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name and tags
        id: meta
        if: steps.branch_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          IMAGE_NAME="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            # Pre-release build from a working branch for soak testing. Never touch the release or
            # latest tags: publish <branch> and <branch>-<short sha> instead.
            BRANCH_TAG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
            TAGS="$(printf '%s\n%s' "${IMAGE_NAME}:${BRANCH_TAG}" "${IMAGE_NAME}:${BRANCH_TAG}-${GITHUB_SHA::7}")"
          else
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              VERSION_TAG="${GITHUB_REF_NAME}"
            else
              VERSION_TAG="$(git tag --sort=-v:refname | head -n1)"
            fi

            if [ -z "${VERSION_TAG}" ]; then
              echo "No git tags were found. Create a tag before running this workflow."
              exit 1
            fi

            # The footer shows the project's <Version>, so a release tag must match it.
            PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' h2s/h2s.csproj | head -n1)"
            if [ "${VERSION_TAG}" != "${PROJECT_VERSION}" ]; then
              echo "::error::Tag ${VERSION_TAG} doesn't match <Version>${PROJECT_VERSION}</Version> in h2s/h2s.csproj. Bump the version, then tag that commit."
              exit 1
            fi

            TAGS="$(printf '%s\n%s' "${IMAGE_NAME}:${VERSION_TAG}" "${IMAGE_NAME}:latest")"
          fi

          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./h2s/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report published tags
        if: steps.branch_check.outputs.should_publish == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image tags"
            echo
            while IFS= read -r tag; do echo "- \`${tag}\`"; done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report skipped publish
        if: steps.branch_check.outputs.should_publish != 'true'
        run: echo "Workflow completed without publishing because the tag is not on master."
